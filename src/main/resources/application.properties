spring.application.name=dancewithme

# Server
server.port=3002

# PostgreSQL
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASS}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=2592000000

# CORS
cors.allowed-origin-patterns=*

# Swagger / OpenAPI  (/v3 = OpenAPI spec version, not API version)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html


# App URLs  — change in production
app.name=DanceWithMe
app.base-url=http://localhost:3002
app.frontend-url=http://localhost:3000

# Email Configuration
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST}
spring.mail.properties.mail.smtp.ssl.enable=false
spring.mail.properties.mail.smtp.from=${MAIL_USERNAME}

# Supabase Storage
supabase.enabled=true
supabase.url=${SUPABASE_URL}
supabase.key=${SUPABASE_SERVICE_KEY}
supabase.bucket=${SUPABASE_BUCKET}
